name: Distribution checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node scripts/check-export.mjs
      - run: npm run check
      - run: mkdir -p dist && npm run pack
      - run: node scripts/package-smoke.mjs
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e 'packages/castrook-python[dev]' PyYAML
      - run: python -m pytest packages/castrook-python/tests
      - run: python -m mypy && python -m ruff check src tests && python -m build && python -m twine check dist/*
        working-directory: packages/castrook-python
      - run: python -m pip install --force-reinstall packages/castrook-python/dist/*.whl && python packages/castrook-python/tests/wheel_smoke.py
      - run: python scripts/check-skills.py

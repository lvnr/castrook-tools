name: Publish Python
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version to publish from main
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-python
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  build:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - name: Check requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          meta = tomllib.loads(pathlib.Path('packages/castrook-python/pyproject.toml').read_text())
          assert meta['project']['version'] == os.environ['RELEASE_VERSION'], 'Version differs from source'
          PY
      - run: python -m build && python -m twine check dist/*
        working-directory: packages/castrook-python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-release
          path: packages/castrook-python/dist/*
          retention-days: 7
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/castrook/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-release
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
